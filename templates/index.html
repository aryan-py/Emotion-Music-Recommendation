<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Music Recommender</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link type="text/css" href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>

<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">♪</span>
        <span class="logo-text">MoodTunes</span>
      </div>
      <div class="header-badge">
        <span class="pulse-dot"></span>
        Live Detection
      </div>
    </div>
  </header>

  <main class="app-main">

    <!-- Camera Column -->
    <section class="panel camera-panel">
      <div class="panel-header">
        <h2 class="panel-title">Emotion Detector</h2>
        <div class="status-chip" id="statusChip">
          <span class="status-dot"></span>
          <span id="statusText">Starting camera...</span>
        </div>
      </div>

      <!-- Camera permission error -->
      <div class="camera-error hidden" id="cameraError">
        <span>📷</span>
        <p>Camera access denied.</p>
        <small>Allow camera permission in your browser and refresh.</small>
      </div>

      <!-- Video wrapper (hidden until camera is ready) -->
      <div class="video-wrapper hidden" id="videoWrapper">
        <!-- Live video feed -->
        <video id="videoEl" autoplay playsinline muted></video>
        <!-- Canvas overlay: face rectangle drawn client-side from server coords -->
        <canvas id="overlayCanvas"></canvas>
        <!-- Hidden canvas used only for capturing frames to send to server -->
        <canvas id="captureCanvas" style="display:none"></canvas>
        <div class="video-overlay">
          <div class="emotion-badge" id="emotionBadge">
            <span class="emotion-icon" id="emotionIcon">😐</span>
            <span class="emotion-label" id="emotionLabel">Neutral</span>
          </div>
        </div>
      </div>

      <div class="camera-footer">
        <div class="stat-pill">
          <span class="stat-label">Songs found</span>
          <span class="stat-value" id="songCount">—</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Detected emotion</span>
          <span class="stat-value" id="emotionStat">—</span>
        </div>
      </div>
    </section>

    <!-- Songs Column -->
    <section class="panel songs-panel">
      <div class="panel-header">
        <h2 class="panel-title">Song Recommendations</h2>
        <button class="refresh-btn" id="refreshBtn" title="Refresh now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
      </div>

      <div class="songs-list" id="songsList">
        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p>Waiting for camera...</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    const emotionMeta = {
      Angry:     { icon: "😠", color: "#ff4d4d" },
      Disgusted: { icon: "🤢", color: "#8bc34a" },
      Fearful:   { icon: "😨", color: "#9c27b0" },
      Happy:     { icon: "😄", color: "#ffc107" },
      Neutral:   { icon: "😐", color: "#0ccac4" },
      Sad:       { icon: "😢", color: "#2196f3" },
      Surprised: { icon: "😲", color: "#ff9800" },
    };

    const videoEl      = document.getElementById('videoEl');
    const overlayCanvas= document.getElementById('overlayCanvas');
    const overlayCtx   = overlayCanvas.getContext('2d');
    const captureCanvas= document.getElementById('captureCanvas');
    const captureCtx   = captureCanvas.getContext('2d');
    const videoWrapper = document.getElementById('videoWrapper');
    const cameraError  = document.getElementById('cameraError');
    const statusChip   = document.getElementById('statusChip');
    const statusText   = document.getElementById('statusText');
    const emotionIcon  = document.getElementById('emotionIcon');
    const emotionLabel = document.getElementById('emotionLabel');
    const emotionStat  = document.getElementById('emotionStat');
    const songCount    = document.getElementById('songCount');
    const songsList    = document.getElementById('songsList');
    const refreshBtn   = document.getElementById('refreshBtn');

    let isSending = false;

    // ── Start webcam ────────────────────────────────────────
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        videoEl.srcObject = stream;
        videoEl.onloadedmetadata = () => {
          videoWrapper.classList.remove('hidden');
          statusText.textContent = 'Detecting...';
          statusChip.classList.add('active');
          scheduleCapture();
        };
      } catch (err) {
        cameraError.classList.remove('hidden');
        statusText.textContent = 'Camera error';
        console.error('Camera error:', err);
      }
    }

    // ── Draw face boxes on overlay canvas ───────────────────
    function drawFaces(faces) {
      const vw = videoEl.videoWidth  || videoEl.clientWidth;
      const vh = videoEl.videoHeight || videoEl.clientHeight;
      overlayCanvas.width  = overlayCanvas.offsetWidth;
      overlayCanvas.height = overlayCanvas.offsetHeight;
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

      faces.forEach(face => {
        const x = face.x * overlayCanvas.width;
        const y = face.y * overlayCanvas.height;
        const w = face.w * overlayCanvas.width;
        const h = face.h * overlayCanvas.height;

        // Face rectangle
        overlayCtx.strokeStyle = '#0ccac4';
        overlayCtx.lineWidth   = 2;
        overlayCtx.strokeRect(x, y, w, h);

        // Emotion label background
        const label   = face.emotion;
        const fontSize= Math.max(12, Math.round(overlayCanvas.width * 0.03));
        overlayCtx.font = `600 ${fontSize}px Poppins, sans-serif`;
        const textW = overlayCtx.measureText(label).width;
        overlayCtx.fillStyle = '#0ccac4';
        overlayCtx.fillRect(x - 1, y - fontSize - 8, textW + 12, fontSize + 10);

        // Emotion label text
        overlayCtx.fillStyle = '#000';
        overlayCtx.fillText(label, x + 5, y - 4);
      });
    }

    // ── Capture & send frame ────────────────────────────────
    function captureAndSend() {
      if (isSending || videoEl.readyState < 2) return;
      isSending = true;

      captureCanvas.width  = videoEl.videoWidth  || 640;
      captureCanvas.height = videoEl.videoHeight || 480;
      captureCtx.drawImage(videoEl, 0, 0, captureCanvas.width, captureCanvas.height);

      const dataURL = captureCanvas.toDataURL('image/jpeg', 0.8);

      fetch('/process_frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ frame: dataURL }),
      })
        .then(r => r.json())
        .then(data => {
          drawFaces(data.faces || []);
          updateEmotion(data.emotion);
          renderSongs(data.songs);
        })
        .catch(err => console.error('Frame error:', err))
        .finally(() => { isSending = false; });
    }

    function scheduleCapture() {
      setInterval(captureAndSend, 1500);
    }

    // ── Update emotion UI ────────────────────────────────────
    function updateEmotion(emotion) {
      const meta = emotionMeta[emotion] || emotionMeta.Neutral;
      emotionIcon.textContent  = meta.icon;
      emotionLabel.textContent = emotion;
      emotionStat.textContent  = emotion;
      document.getElementById('emotionBadge').style.borderColor = meta.color + '55';
    }

    // ── Render song cards ────────────────────────────────────
    function renderSongs(data) {
      if (!data || data.length === 0) {
        songsList.innerHTML = '<div class="empty-state"><span>🎵</span><p>No songs yet — smile at the camera!</p></div>';
        return;
      }

      songCount.textContent = data.length;

      let html = '';
      data.forEach(function(song, i) {
        const name   = escapeHtml(song.Name   || '—');
        const album  = escapeHtml(song.Album  || '—');
        const artist = escapeHtml(song.Artist || '—');
        const initials = (song.Artist || '♪').trim().split(' ')
          .map(w => w[0]).join('').slice(0, 2).toUpperCase();

        html += `
          <div class="song-card" style="animation-delay:${i * 25}ms">
            <div class="song-avatar">${initials}</div>
            <div class="song-info">
              <div class="song-name">${name}</div>
              <div class="song-meta">${artist} &middot; ${album}</div>
            </div>
            <div class="song-num">${String(i + 1).padStart(2, '0')}</div>
          </div>`;
      });

      songsList.innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── Manual refresh ───────────────────────────────────────
    refreshBtn.addEventListener('click', () => {
      refreshBtn.classList.add('spinning');
      captureAndSend();
      setTimeout(() => refreshBtn.classList.remove('spinning'), 600);
    });

    // ── Boot ─────────────────────────────────────────────────
    startCamera();
  </script>

</body>
</html>
